[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradecircuitai"
version = "0.1.0"
description = "Deterministic paper-trading risk circuits for untrusted model intents"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
tradecircuitai = "tradecircuitai.cli:main"

[tool.setuptools.package-data]
tradecircuitai = ["data/*.json", "data/*.jsonl"]
